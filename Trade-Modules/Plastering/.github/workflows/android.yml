# بناء تطبيق أندرويد (APK) لحساباتي للمحارة
# - بدون كلمة سر توقيع: يتعمل APK للتجربة (موقّع بمفتاح debug) ويتنزل من صفحة الـ Actions.
# - مع كلمة سر PLASTER_KEY_PASSWORD في Secrets: يتعمل مفتاح توقيع دائم ويتنشر APK رسمي في Releases (من main فقط).
name: Android APK

on:
  push:
    paths:
      - "index.html"
      - "js/**"
      - "css/**"
      - "version.json"
      - "icons/**"
      - "android/**"
      - "tools/android-assets.sh"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      version: ${{ steps.ver.outputs.version }}
    env:
      PLASTER_KEY_PASSWORD: ${{ secrets.PLASTER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Version
        id: ver
        run: echo "version=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: App files
        run: bash tools/android-assets.sh

      - name: Signing key
        id: key
        run: |
          if [ -z "${PLASTER_KEY_PASSWORD}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::كلمة سر التوقيع PLASTER_KEY_PASSWORD مش متضافة — هيتعمل APK للتجربة فقط"
            exit 0
          fi
          KS="$RUNNER_TEMP/plaster.jks"
          if [ -f android/keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore.enc -out "$KS" -pass env:PLASTER_KEY_PASSWORD
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias plaster -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PLASTER_KEY_PASSWORD" -keypass "$PLASTER_KEY_PASSWORD" \
              -dname "CN=Hesabati Plaster, O=Hesabati, C=EG"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out android/keystore.enc -pass env:PLASTER_KEY_PASSWORD
            echo "new_key=true" >> "$GITHUB_OUTPUT"
          fi
          echo "PLASTER_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/hesabati-plaster.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hesabati-plaster-apk
          path: out/hesabati-plaster.apk

      - name: Save encrypted signing key
        if: steps.key.outputs.new_key == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/keystore.enc
          git commit -m "Add encrypted APK signing key [skip ci]"
          git push

  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hesabati-plaster-apk
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          python3 -c "import json;d=json.load(open('version.json'));print('\n'.join('- '+n for n in d['notes']))" > notes.md
          printf '\n\nحمّل الملف hesabati-plaster.apk وثبّته على موبايلك الأندرويد.\n' >> notes.md
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" out/hesabati-plaster.apk --clobber
          else
            gh release create "v$VER" out/hesabati-plaster.apk --title "حساباتي للمحارة $VER" --notes-file notes.md --latest
          fi
