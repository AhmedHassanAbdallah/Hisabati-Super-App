# اختبارات محرك الحسابات + اختبار تشغيل كامل في المتصفح
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Engine tests (مقارنة بالحساب اليدوي)
        run: node --test tests/engine.test.js
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: E2E (مشروع كامل + بدون إنترنت + عزل البيانات)
        run: node tests/e2e.js
