<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1b33">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="HESABATI PLASTER — حساباتي للمحارة وتشطيبات الواجهات: حصر المساحات وحساب خامات ومصنعية المحارة والجرافيت والدهارة والمعجون والواجهات، وإدارة المشروعات والعملاء والعمال والمخزن والفواتير.">
  <title>HESABATI PLASTER — حساباتي للمحارة والواجهات</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <script>
    // تطبيق المظهر المحفوظ قبل ظهور الصفحة (مفتاح خاص بتطبيق المحارة فقط)
    try { var _t = localStorage.getItem('hplaster_theme'); if (_t === 'dark' || _t === 'light') document.documentElement.setAttribute('data-theme', _t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app">
    <header class="app-header" id="appHeader"></header>
    <main class="container" id="main"></main>
  </div>

  <nav class="bottom-nav" aria-label="التنقل الرئيسي">
    <button type="button" class="nav-item" data-tab="home" data-act="go" data-view="home"><span class="pill"><i data-icon="home"></i></span>الرئيسية</button>
    <button type="button" class="nav-item" data-tab="projects" data-act="go" data-view="projects"><span class="pill"><i data-icon="folder"></i></span>المشروعات</button>
    <div class="nav-center"><button type="button" class="nav-plus" data-act="plusMenu" aria-label="إضافة جديد"><i data-icon="plus"></i></button></div>
    <button type="button" class="nav-item" data-tab="calc" data-act="go" data-view="calc"><span class="pill"><i data-icon="calc"></i></span>الحاسبات</button>
    <button type="button" class="nav-item" data-tab="more" data-act="go" data-view="more"><span class="pill"><i data-icon="grid"></i></span>المزيد</button>
  </nav>

  <div class="editor-bar hidden" id="editorBar"></div>
  <div class="backdrop" id="backdrop" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

  <div class="dialog-wrap" id="confirmDlg">
    <div class="dialog">
      <div class="d-ic"><i data-icon="alert"></i></div>
      <h3 id="confirmTitle">تأكيد</h3>
      <p id="confirmText"></p>
      <div class="btn-row"><button type="button" class="btn btn-danger" id="confirmYes">نعم</button><button type="button" class="btn btn-ghost" id="confirmNo">إلغاء</button></div>
    </div>
  </div>

  <div id="printModal">
    <div class="preview-toolbar">
      <div class="toolbar-row">
        <button type="button" class="tb-btn close" data-act="closeDoc" aria-label="إغلاق"><i data-icon="x"></i></button>
        <button type="button" class="tb-print" data-act="printDoc"><i data-icon="printer"></i> طباعة / PDF</button>
        <span class="grow"></span>
        <button type="button" class="tb-btn wa" data-act="waDoc"><i data-icon="chat"></i> واتساب</button>
        <button type="button" class="tb-btn" data-act="shareDoc" aria-label="مشاركة"><i data-icon="share"></i></button>
      </div>
      <div class="edit-hint">ورقة A4 · اضغط على أي نص لتعديله قبل الطباعة · لحفظ PDF اختار «حفظ كـ PDF» من نافذة الطباعة</div>
    </div>
    <div id="printViewport"><div id="printSheet"></div></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./js/engine.js"></script>
  <script src="./js/catalog.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/editors.js"></script>
  <script src="./js/views.js"></script>
  <script src="./js/admin.js"></script>
  <script src="./js/docs.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
