<body>

<div id="app">
  <header class="app-header" id="tabHeader" style="--az-sec-tag:'الأرضيات'">
    <img class="brand-ic" src="./icons/icon-192.png" alt="">
    <div class="titles">
      <div class="sub" id="greetLine">أهلاً بيك</div>
      <h1 id="tabTitle">أرزقي | Arzoqi</h1>
    </div>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي والفاتح"><i data-icon="moon"></i></button>
  </header>

  <main class="container">
    <section class="view active" id="view-home"></section>
    <section class="view" id="view-projects"></section>
    <section class="view" id="view-calc"></section>
    <section class="view" id="view-more"></section>
    <noscript><div class="warn-box">التطبيق محتاج تفعيل JavaScript علشان يشتغل.</div></noscript>
  </main>

  <nav class="bottom-nav" aria-label="أقسام التطبيق">
    <button type="button" class="nav-item active" id="navBtn-home" data-nav="home"><span class="pill"><i data-icon="home"></i></span>الرئيسية</button>
    <button type="button" class="nav-item" id="navBtn-projects" data-nav="projects"><span class="pill"><i data-icon="briefcase"></i></span>المشروعات</button>
    <div class="nav-center"><button type="button" class="nav-plus" id="navPlus" aria-label="إنشاء جديد"><i data-icon="plus"></i></button></div>

  </nav>

<!-- نافذة التأكيد -->
<div class="dialog-wrap" id="appConfirmModal">
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="appConfirmTitle">
    <div class="d-ic"><i data-icon="alert"></i></div>
    <h3 id="appConfirmTitle">تأكيد</h3>
    <p id="appConfirmText"></p>
    <div class="btn-row">
      <button type="button" class="btn btn-danger" id="appConfirmYesBtn">نعم، تأكيد</button>
      <button type="button" class="btn btn-ghost" id="appConfirmNoBtn">إلغاء</button>
    </div>
  </div>
</div>

<!-- شريط التحديث -->
<div class="upd-banner hidden" id="updBanner" role="status">
  <span><b>تحديث جديد جاهز</b><small>بياناتك محفوظة ومش هتتأثر</small></span>
  <button type="button" class="btn btn-accent btn-sm" id="updNow">تحديث الآن</button>
  <button type="button" class="close-x" id="updLater" aria-label="لاحقاً"><i data-icon="x"></i></button>
</div>

<div id="appToast" class="toast" role="status" aria-live="polite"></div>

<script>window.APP_VERSION = '1.0.2';</script>
<script src="./js/calc.js"></script>
<script src="./js/finance.js"></script>
<script src="./js/store.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/app.js"></script>
<script src="./js/modules.js"></script>
<script src="./js/calculators.js"></script>
<script src="./js/docs.js"></script>
<script>
  App.init();
  // Service Worker: يشغّل التطبيق بدون إنترنت ويجيب التحديثات (نطاقه مجلد التطبيق ده بس)
  (function () {
    var IN_APP = !!(window.HFloorApp && typeof window.HFloorApp.versionName === 'function');
    if (IN_APP) { console.info('HFLOORING_READY ' + window.APP_VERSION); return; }
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    var banner = document.getElementById('updBanner'), reg = null, reloading = false;
    window.SWUpdate = {
      waiting: null,
      apply: function () { if (this.waiting) this.waiting.postMessage({ type: 'SKIP_WAITING' }); },
      check: function () { return reg ? reg.update().then(function () { return !!(reg.waiting || reg.installing); }) : Promise.resolve(false); }
    };
    function showWaiting(w) { window.SWUpdate.waiting = w; banner.classList.remove('hidden'); }
    document.getElementById('updNow').onclick = function () { Store.save(); window.SWUpdate.apply(); };
    document.getElementById('updLater').onclick = function () { banner.classList.add('hidden'); };
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (reloading) return; reloading = true; Store.save(); location.reload(); });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js', { scope: './', updateViaCache: 'none' }).then(function (r) {
        reg = r;
        if (r.waiting && navigator.serviceWorker.controller) showWaiting(r.waiting);
        r.addEventListener('updatefound', function () {
          var nw = r.installing; if (!nw) return;
          nw.addEventListener('statechange', function () { if (nw.state === 'installed' && navigator.serviceWorker.controller) showWaiting(nw); });
        });
        setInterval(function () { r.update().catch(function () {}); }, 60 * 60 * 1000);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) r.update().catch(function () {}); });
      }).catch(function (e) { console.warn('SW', e); });
    });
  })();
</script>
</body>
</html>
