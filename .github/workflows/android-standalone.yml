# بناء "حساباتي أوفلاين" — تطبيق أندرويد مستقل بالكامل (كل الأقسام جوه التطبيق) — APK + AAB لجوجل بلاي.
# بيتبني من نفس ملفات الموقع (Main-App / Shared-Assets / Trade-Modules) من غير أي تعديل عليها،
# وبيتجرب على محاكي أندرويد حقيقي (الرئيسية + الأقسام السبعة) قبل النشر.
# التوقيع: نفس مفتاح التطبيق (android/keystore.enc + HISABATI_KEY_PASSWORD).
# © 2026 أحمد حسن عبدالله - جميع الحقوق محفوظة.
name: Android Standalone

on:
  push:
    branches: [main]
    paths:
      - "android-standalone/**"
      - "Main-App/**"
      - "Shared-Assets/**"
      - "Trade-Modules/**"
      - "version.json"
      - "tools/android-standalone-smoke.sh"
      - ".github/workflows/android-standalone.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      version: ${{ steps.ver.outputs.version }}
      sha1: ${{ steps.key.outputs.sha1 }}
      sha256: ${{ steps.key.outputs.sha256 }}
    env:
      HISABATI_KEY_PASSWORD: ${{ secrets.HISABATI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          V="$(python3 -c "import json;print(json.load(open('version.json'))['version'])")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        run: |
          if [ -z "${HISABATI_KEY_PASSWORD}" ] || [ ! -f android/keystore.enc ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::مفتاح التوقيع مش متاح — هيتعمل APK للاختبار بس"
            exit 0
          fi
          KS="$RUNNER_TEMP/hisabati.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore.enc -out "$KS" -pass env:HISABATI_KEY_PASSWORD
          LIST="$(keytool -list -v -keystore "$KS" -alias hisabati -storepass "$HISABATI_KEY_PASSWORD")"
          echo "sha1=$(echo "$LIST" | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$LIST" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)" >> "$GITHUB_OUTPUT"
          echo "HISABATI_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK + AAB
        working-directory: android-standalone
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Check bundled web files
        run: |
          W=android-standalone/app/build/generated/hisabati-web/www
          for f in Main-App/index.html Main-App/launcher.js Shared-Assets/fonts/cairo.css \
                   Trade-Modules/Electrical/index.html Trade-Modules/Plumbing/index.html Trade-Modules/HVAC/index.html \
                   Trade-Modules/Painting/index.html Trade-Modules/Flooring/index.html Trade-Modules/Gypsum/index.html \
                   Trade-Modules/Plastering/index.html; do
            test -f "$W/$f" || { echo "::error::ناقص $f"; exit 1; }
            cmp -s "$W/$f" "$f" || { echo "::error::$f مختلف عن الأصل"; exit 1; }
          done
          ! find "$W" -path '*/android/*' -o -path '*/tests/*' | grep -q . || { echo "::error::ملفات أندرويد/اختبارات اتنسخت"; exit 1; }
          echo "✔ ملفات الويب جوه التطبيق مطابقة للموقع ($(find "$W" -type f | wc -l) ملف)"

      - name: Collect
        run: |
          mkdir -p out
          cp android-standalone/app/build/outputs/apk/release/*.apk out/hisabati-offline.apk
          cp android-standalone/app/build/outputs/bundle/release/*.aab out/hisabati-offline.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hisabati-offline
          path: out/

      - name: Summary
        run: |
          {
            echo "## حساباتي أوفلاين ${{ steps.ver.outputs.version }}"
            echo ""
            echo "- Package: \`com.ahmedhassan.hisabati.offline\`"
            echo "- SHA-1 (لعميل Android في Google Cloud): \`${{ steps.key.outputs.sha1 }}\`"
            echo "- SHA-256: \`${{ steps.key.outputs.sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hisabati-offline
          path: apk
      - name: Keep the APK only
        run: rm -f apk/*.aab && ls -la apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android-standalone-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screens
          path: |
            shots/
            logcat*.txt

  release:
    needs: [build, test]
    if: needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hisabati-offline
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
          SHA1: ${{ needs.build.outputs.sha1 }}
        run: |
          TAG="offline-v$VER"
          {
            echo "**حساباتي أوفلاين** — كل الأقسام جوه التطبيق، بيشتغل من غير إنترنت ومن غير Chrome."
            echo ""
            python3 -c "import json;d=json.load(open('version.json'));print('\n'.join('- '+n for n in d['notes']))"
            echo ""
            echo "- **hisabati-offline.apk**: للتثبيت المباشر على الموبايل."
            echo "- **hisabati-offline.aab**: للرفع على جوجل بلاي."
            echo ""
            echo "Package: \`com.ahmedhassan.hisabati.offline\` · SHA-1: \`$SHA1\`"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/hisabati-offline.apk out/hisabati-offline.aab --clobber
            gh release edit "$TAG" --notes-file notes.md --latest=false
          else
            gh release create "$TAG" out/hisabati-offline.apk out/hisabati-offline.aab --title "حساباتي أوفلاين $VER" --notes-file notes.md --latest=false
          fi
