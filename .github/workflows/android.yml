# بناء تطبيق أرزقي | Arzoqi للأندرويد (APK — Trusted Web Activity) ونشره كرابط تحميل مباشر في Releases.
# التطبيق بيفتح الموقع جوه Chrome بملء الشاشة، فكل الأقسام وتسجيل الدخول بجوجل والطباعة بتشتغل زي الموقع.
# مفتاح التوقيع: بيتعمل أول مرة ويتحفظ مشفّر في android/keystore.enc بكلمة السر HISABATI_KEY_PASSWORD
# (Settings ← Secrets and variables ← Actions). نفس المفتاح لازم يفضل علشان التحديثات تتثبت فوق القديم.
# © 2026 أحمد حسن عبدالله - جميع الحقوق محفوظة.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "version.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
      version: ${{ steps.ver.outputs.version }}
      sha256: ${{ steps.key.outputs.sha256 }}
    env:
      HISABATI_KEY_PASSWORD: ${{ secrets.HISABATI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          V="$(python3 -c "import json;print(json.load(open('version.json'))['version'])")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Signing key
        id: key
        run: |
          if [ -z "${HISABATI_KEY_PASSWORD}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::كلمة سر التوقيع HISABATI_KEY_PASSWORD مش متضافة — هيتعمل APK للاختبار بس ومش هيتنشر"
            exit 0
          fi
          KS="$RUNNER_TEMP/hisabati.jks"
          if [ -f android/keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/keystore.enc -out "$KS" -pass env:HISABATI_KEY_PASSWORD
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias hisabati -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$HISABATI_KEY_PASSWORD" -keypass "$HISABATI_KEY_PASSWORD" \
              -dname "CN=Ahmed Hassan Abdallah, O=Hisabati, C=EG"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$KS" -out android/keystore.enc -pass env:HISABATI_KEY_PASSWORD
            echo "new_key=true" >> "$GITHUB_OUTPUT"
          fi
          SHA="$(keytool -list -v -keystore "$KS" -alias hisabati -storepass "$HISABATI_KEY_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "HISABATI_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
          # ملف ربط الدومين بالتطبيق (علشان يفتح بملء الشاشة من غير شريط العنوان)
          python3 - "$SHA" <<'PY'
          import json, sys
          json.dump([{"relation": ["delegate_permission/common.handle_all_urls"],
                      "target": {"namespace": "android_app", "package_name": "com.ahmedhassan.hisabati",
                                 "sha256_cert_fingerprints": [sys.argv[1]]}}],
                    open("android/assetlinks.json", "w"), indent=2)
          PY
          cat android/assetlinks.json

      - name: Build APK + AAB (Google Play)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/hisabati.apk
          cp android/app/build/outputs/bundle/release/*.aab out/hisabati.aab
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: hisabati-apk
          path: |
            out/hisabati.apk
            out/hisabati.aab

      - name: Save signing key fingerprint (and encrypted key on first run)
        if: steps.key.outputs.signed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/assetlinks.json
          [ "${{ steps.key.outputs.new_key }}" = "true" ] && git add android/keystore.enc
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "Add APK signing key fingerprint [skip ci]"
          git push

      - name: Summary
        run: |
          {
            echo "## أرزقي | Arzoqi (ويب) ${{ steps.ver.outputs.version }}"
            echo ""
            if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
              echo "✅ APK موقّع — هيتنشر في Releases"
              echo ""
              echo "SHA-256: \`${{ steps.key.outputs.sha256 }}\`"
            else
              echo "⚠️ APK اختبار (من غير توقيع رسمي). ضيف HISABATI_KEY_PASSWORD في Secrets علشان يتنشر."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: needs.build.outputs.signed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hisabati-apk
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          python3 -c "import json;d=json.load(open('version.json'));print('\n'.join('- '+n for n in d['notes']))" > notes.md
          printf '\n\n- **hisabati.apk**: للتثبيت المباشر على الموبايل.\n- **hisabati.aab**: للرفع على جوجل بلاي (Play Console).\n\nالتطبيق محتاج متصفح Chrome على الموبايل (موجود على أغلب الموبايلات).\n' >> notes.md
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" out/hisabati.apk out/hisabati.aab --clobber
            gh release edit "v$VER" --notes-file notes.md --latest
          else
            gh release create "v$VER" out/hisabati.apk out/hisabati.aab --title "أرزقي | Arzoqi (ويب) $VER" --notes-file notes.md --latest
          fi
